<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#primaryGrad)"/>
  
  <!-- Barcode stripes -->
  <g fill="#93c5fd" opacity="0.4">
    <rect x="22" y="58" width="4" height="24" rx="1"/>
    <rect x="29" y="58" width="7" height="24" rx="1"/>
    <rect x="39" y="58" width="3" height="24" rx="1"/>
    <rect x="45" y="58" width="6" height="24" rx="1"/>
    <rect x="54" y="58" width="4" height="24" rx="1"/>
    <rect x="61" y="58" width="7" height="24" rx="1"/>
    <rect x="71" y="58" width="5" height="24" rx="1"/>
  </g>

  <!-- Laser / Scanner Beam Line -->
  <line x1="16" y1="69" x2="84" y2="69" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Graduation Cap -->
  <path d="M50 20 L20 33 L50 46 L80 33 Z" fill="#ffffff"/>
  <path d="M32 40 L32 50 C32 58 68 58 68 50 L68 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M74 36 L82 48 L80 50" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="80" cy="51" r="2.5" fill="#38bdf8"/>
</svg>
